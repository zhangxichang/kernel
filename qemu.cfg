[machine]
type = "q35"

[memory]
size = "512M"

[drive "uefi"]
if = "pflash"
readonly = "on"
format = "raw"
file = "edk2-x86_64-code.fd"

[device "usb1"]
driver = "qemu-xhci"

[device "storage"]
driver = "usb-storage"
bus = "usb1.0"
drive = "disk"

[drive "disk"]
if = "none"
format = "raw"
file = "fat:rw:esp"
